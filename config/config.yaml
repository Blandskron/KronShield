# -----------------------------------------------------------------------------
# Configuration file for the Web Audit Engine
# Defines core parameters for timeouts, ports, injection payloads and the LLM.
#
# - timeouts: request-level time limits (in seconds)
# - ports_to_scan: HTTP/HTTPS ports used during the port scanning phase
# - xss_payloads / sqli_payloads: fallback payloads used if the LLM is unavailable
# - llm: Groq provider settings (model, sampling, reasoning effort)
# -----------------------------------------------------------------------------

timeouts:
  request: 10

ports_to_scan: [80, 443, 8080, 8443]

# LLM provider: Groq (https://console.groq.com/keys)
llm:
  provider: groq
  model: openai/gpt-oss-120b
  temperature: 1
  top_p: 1
  max_completion_tokens: 2048
  reasoning_effort: medium

# Fallback payloads (used only if the LLM returns nothing / fails)
xss_payloads:
  - "<script>alert(1)</script>"
  - "'\"><img src=x onerror=alert(1)>"

sqli_payloads:
  - "' OR '1'='1"
  - "\" OR \"1\"=\"1"
