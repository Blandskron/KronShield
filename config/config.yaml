# -----------------------------------------------------------------------------
# Configuration file for the Web Audit Engine
#
# - timeouts: request-level time limits (in seconds)
# - ports_to_scan: HTTP/HTTPS ports used during the port scanning phase
# - llm: Groq provider settings (model, sampling, reasoning effort)
# -----------------------------------------------------------------------------

timeouts:
  request: 10

# Process-local budget per authorized audit job.
execution:
  max_operations: 30
  max_bytes: 4194304
  max_response_bytes: 262144
  max_seconds: 120
  operations_per_second: 1
  burst: 1
  max_concurrent: 2

ports_to_scan: [80, 443, 8080, 8443]

# LLM provider: Groq (https://console.groq.com/keys)
llm:
  provider: groq
  model: openai/gpt-oss-120b
  temperature: 1
  top_p: 1
  max_completion_tokens: 2048
  reasoning_effort: medium
