[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blandskron-pentest-agent"
version = "0.2.0"
description = "CLI for audit planning, offline evidence analysis, and reporting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dnspython>=2.8,<3",
    "groq>=1.7",
    "httpx>=0.27",
    "idna>=3,<4",
    "pydantic>=2,<3",
    "python-dotenv>=1",
    "PyYAML>=6",
    "SQLAlchemy>=2",
    "typer>=0.12",
]

[project.scripts]
pentest-agent = "cli.entrypoint:app"

[project.optional-dependencies]
postgres = ["alembic>=1.15,<2", "psycopg[binary]>=3.2,<4"]

api = ["cryptography>=44", "fastapi>=0.120,<1", "PyJWT[crypto]>=2.10,<3", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = ["flake8>=7,<8", "pytest>=8,<10"]

[tool.setuptools]
packages = ["adapters", "adapters.api", "application", "cli", "core", "domain", "gpt", "infra", "reports"]

[tool.pytest.ini_options]
testpaths = ["tests"]
